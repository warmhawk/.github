<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="whBannerTitle">
  <title id="whBannerTitle">WarmHawk — self-hosted cold-email infrastructure, one server per account</title>
  <defs>
    <linearGradient id="heroTrace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DE9E38"/>
      <stop offset="1" stop-color="#B94B27"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="#F3EEE1"/>

  <g transform="translate(56,44)">
    <rect width="30" height="30" rx="7.5" fill="#B94B27"/>
    <path d="M5.6 20.6L13.1 9.4L16.9 15L24.4 7.5" stroke="#FBF8F1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="24.4" cy="7.5" r="1.9" fill="#DE9E38"/>
  </g>
  <text x="98" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#251D14">WarmHawk</text>

  <text x="56" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12"
        letter-spacing="2" fill="#B94B27">SELF-HOSTED COLD-EMAIL INFRASTRUCTURE</text>

  <text font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#251D14">
    <tspan x="56" y="168">Your sending engine.</tspan>
    <tspan x="56" y="212">Your server. </tspan><tspan font-style="italic" fill="#B94B27">Your data.</tspan>
  </text>

  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5A4E3F">
    <tspan x="56" y="250">Unlimited mailboxes, zero per-seat fees, real deliverability data</tspan>
    <tspan x="56" y="272">instead of a vanity warmup score.</tspan>
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
    <rect x="56" y="300" width="520" height="34" rx="7" fill="#25322B"/>
    <circle cx="75" cy="317" r="2.6" fill="#DE9E38"/>
    <text x="88" y="321.5" fill="#FBF8F1">$</text>
    <text x="101" y="321.5" fill="#B9C3BA">install.sh --domain api.yourcompany.com</text>
  </g>

  <text x="56" y="366" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5A4E3F">100% single-tenant</text>
  <text x="220" y="366" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5A4E3F">·  &lt;10 min install</text>
  <text x="390" y="366" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5A4E3F">·  $0 per seat</text>

  <g transform="translate(760,64)">
    <rect width="464" height="272" rx="14" fill="#FBF8F1" stroke="#D9CDAF"/>
    <text x="24" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1" fill="#5A4E3F">DOMAIN HEALTH — ACME-OUTREACH.COM</text>
    <text x="440" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1" fill="#5A4E3F">LIVE</text>
    <line x1="24" y1="52" x2="440" y2="52" stroke="#D9CDAF"/>

    <text x="24" y="82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5A4E3F">Vendor warmup &#8220;heat score&#8221;</text>
    <text x="24" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8a7a68">self-reported by the sending tool</text>
    <text x="440" y="88" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#a99c8c" text-decoration="line-through">97</text>

    <line x1="24" y1="116" x2="440" y2="116" stroke="#EAE1CB"/>

    <text x="24" y="146" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5A4E3F">Real inbox placement</text>
    <text x="24" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8a7a68">seed-inbox placement test</text>
    <circle cx="398" cy="150" r="3.5" fill="#B94B27"/>
    <text x="440" y="155" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#B94B27">94%</text>

    <path d="M24 224 L44 224 L50 209 L56 233 L62 216 L68 224 L88 224 L94 212 L100 228 L106 219 L112 224 L134 224 L140 205 L146 235 L152 218 L158 224 L180 224 L186 210 L192 231 L198 221 L204 224 L226 224 L232 213 L238 227 L244 224 L260 224"
          fill="none" stroke="url(#heroTrace)" stroke-width="2.2"/>
    <text x="24" y="252" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8a7a68">Illustrative example, not live data.</text>
  </g>
</svg>
